name: Sync Garmin Activities

on:
  # 16:00 UTC = 18:00 czasu polskiego latem, 17:00 zimą (cron w Actions chodzi tylko po UTC).
  # Raz dziennie, wieczorem - Garmin blokuje IP GitHuba przy częstym logowaniu.
  schedule:
    - cron: '0 21 * * *'

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync Garmin activities
        env:
          # GARMINTOKENS ma priorytet nad logowaniem hasłem - runner nie zachowuje cache'a w ~
          GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: |
          python sync_garmin.py 3

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-logs-${{ github.run_number }}
          path: sync_garmin.log
          retention-days: 7

      - name: Notify on failure (optional)
        if: failure()
        run: |
          echo "Sync failed! Check the logs for details."
          cat sync_garmin.log
